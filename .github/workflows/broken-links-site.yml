name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # Runs after a successful deploy from main (not after PR preview builds).
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-24.04
    steps:
      # Check the site exactly as it was just published to gh-pages, instead of rebuilding it
      # from scratch (the rebuild took ~5 minutes and needed its own Ruby/ImageMagick setup).
      - name: Checkout published site 🛎️
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # only check local links
          args: --offline --root-dir ${{ github.workspace }}/site --no-progress 'site/**/*.html'
